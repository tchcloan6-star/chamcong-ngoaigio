<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo dõi chấm công ngoài giờ</title>
<link rel="stylesheet" href="app.css">
<style>
.recent-table{width:100%;border-collapse:collapse;font-size:13px}
.recent-table th{background:#2563eb;color:#fff;padding:6px 8px;text-align:left;position:sticky;top:0;font-weight:600;font-size:12px;white-space:nowrap}
.recent-table td{padding:5px 8px;border-bottom:1px solid #e2e8f0;white-space:nowrap}
.recent-table tr:hover td{background:#eff6ff}
.recent-table .stt{width:30px;text-align:center;color:#94a3b8}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.s7{background:#fef3c7;color:#92400e}
.s16{background:#dbeafe;color:#1e40af}
.kpi{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.kpi .box{flex:1;min-width:120px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;text-align:center}
.kpi .n{font-size:28px;font-weight:700;color:#1e3a8a}
.kpi .l{font-size:12px;color:#64748b;margin-top:2px}
.group-head{background:#f1f5f9;font-weight:600}
.group-head td{padding:4px 10px;color:#334155;border-bottom:2px solid #cbd5e1;font-size:12px}
</style>
</head>
<body>
<div class="topbar"><div class="wrap">
  <div class="mark">NG</div>
  <div><h1>Theo dõi chấm công</h1><div class="sub" id="upd">Đang tải…</div></div>
</div></div>

<div class="wrap">
  <a class="backlink" href="index.html">← Về trang chấm công</a>
  <div class="toast" id="toast"></div>

  <button class="btn ghost" id="reload" style="margin-bottom:16px;width:100%">Làm mới dữ liệu</button>

  <div id="loading" class="loading">Đang tải dữ liệu…</div>

  <div id="content" style="display:none">
    <div class="kpi">
      <div class="box"><div class="n" id="kTotal">0</div><div class="l">Tổng lượt đã ghi</div></div>
      <div class="box"><div class="n" id="kShown">0</div><div class="l">Đang hiển thị</div></div>
    </div>

    <div class="panel">
      <h2>Dữ liệu chấm công mới nhất</h2>
      <p style="color:#64748b;font-size:12px;margin:-8px 0 12px">Hiển thị 50 dòng.</p>
      <div style="overflow-x:auto">
      <table class="recent-table">
        <thead><tr>
          <th class="stt">#</th>
          <th>Thời gian gửi</th>
          <th>Họ tên</th>
          <th>Loại</th>
          <th>Ghi chú</th>
        </tr></thead>
        <tbody id="tbRecent"></tbody>
      </table>
      </div>
      <div class="empty" id="emRecent" style="display:none">Chưa có dữ liệu chấm công nào.</div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
document.getElementById('reload').onclick=load;
load();

function load(){
  show(document.getElementById('loading'),true);
  document.getElementById('content').style.display='none';
  var url=APP_CONFIG.API_URL+'?action=recent&limit=50';
  fetch(url).then(r=>r.json()).then(render).catch(function(e){
    document.getElementById('loading').textContent='Lỗi tải: '+e.message+' — kiểm tra API_URL.';
  });
}

function fmtTime(s){
  if(!s) return '';
  try{
    var d=new Date(s);
    if(isNaN(d)) return String(s);
    var dd=('0'+d.getDate()).slice(-2);
    var mm=('0'+(d.getMonth()+1)).slice(-2);
    var hh=('0'+d.getHours()).slice(-2);
    var mi=('0'+d.getMinutes()).slice(-2);
    return dd+'/'+mm+' '+hh+':'+mi;
  }catch(e){return String(s);}
}

function render(d){
  show(document.getElementById('loading'),false);
  document.getElementById('content').style.display='block';
  document.getElementById('upd').textContent='Cập nhật: '+(d.capNhat||'');
  set('kTotal',d.total||0);
  set('kShown',(d.rows||[]).length);

  var tb=document.getElementById('tbRecent');
  var rows=d.rows||[];
  if(!rows.length){
    tb.innerHTML='';
    document.getElementById('emRecent').style.display='block';
    return;
  }
  document.getElementById('emRecent').style.display='none';

  var lastGroup='';
  var html='';
  rows.forEach(function(r,i){
    var group=r.ca+'|'+r.boPhan;
    if(group!==lastGroup){
      var tag=r.ca==='THU7'?'<span class="tag s7">Thứ 7</span>':'<span class="tag s16">16-18h</span>';
      html+='<tr class="group-head"><td colspan="5">'+tag+' <b>'+esc(r.boPhan)+'</b></td></tr>';
      lastGroup=group;
    }
    html+='<tr>'+
      '<td class="stt">'+(i+1)+'</td>'+
      '<td>'+fmtTime(r.thoiGian)+'</td>'+
      '<td><b>'+esc(r.hoten)+'</b></td>'+
      '<td>'+esc(r.loai)+'</td>'+
      '<td style="color:#64748b;font-size:12px">'+esc(r.ghiChu||'')+'</td>'+
    '</tr>';
  });
  tb.innerHTML=html;
}

function set(id,v){document.getElementById(id).textContent=v;}
function show(el,on){el.style.display=on?'block':'none';}
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
</script>
</body>
</html>
